        // --- 渲染畫面邏輯 ---
        function createCard(data, index, type) {
            const prefix = type === 'mcq' ? '選擇' : '填充';
            const colorClass = type === 'mcq' ? 'border-indigo-500' : 'border-emerald-500';
            const bgAnsClass = type === 'mcq' ? 'bg-indigo-50' : 'bg-emerald-50';
            const textAnsClass = type === 'mcq' ? 'text-indigo-800' : 'text-emerald-800';

            return `
                <div class="bg-white rounded-xl shadow-sm border-l-4 ${colorClass} p-5 sm:p-6 transition hover:shadow-md">
                    <h3 class="text-lg font-semibold text-gray-800 leading-relaxed">${data.q}</h3>
                    
                    <button class="toggle-btn mt-4 flex items-center text-sm font-medium text-gray-500 hover:text-indigo-600 transition outline-none">
                        <svg class="w-4 h-4 mr-1 transform transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        <span>查看解答與詳解</span>
                    </button>
                    
                    <div class="answer-block rounded-lg ${bgAnsClass}">
                        <div class="font-bold ${textAnsClass} text-lg mb-3 border-b border-white/50 pb-2">
                            💡 解答：${data.ans}
                        </div>
                        <div class="text-gray-700 leading-relaxed space-y-2 text-[15px]">
                            ${data.exp}
                        </div>
                    </div>
                </div>
            `;
        }

        const mcqSection = document.getElementById('section-mcq');
        const fillSection = document.getElementById('section-fill');

        mcqSection.innerHTML = mcqData.map((d, i) => createCard(d, i, 'mcq')).join('');
        fillSection.innerHTML = fillData.map((d, i) => createCard(d, i, 'fill')).join('');

        // --- 互動邏輯 (Tabs & Accordions) ---
        
        // 渲染完 DOM 後再初始化數學公式
        document.addEventListener("DOMContentLoaded", function() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError : false
            });
            
            // 綁定手風琴(詳解展開)按鈕
            const toggleBtns = document.querySelectorAll('.toggle-btn');
            toggleBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    const ansBlock = this.nextElementSibling;
                    const icon = this.querySelector('svg');
                    const text = this.querySelector('span');
                    
                    ansBlock.classList.toggle('show');
                    
                    if(ansBlock.classList.contains('show')) {
                        icon.classList.add('rotate-180');
                        text.textContent = '隱藏解答';
                    } else {
                        icon.classList.remove('rotate-180');
                        text.textContent = '查看解答與詳解';
                    }
                });
            });
        });

        // 頁籤切換
        const tabMcq = document.getElementById('tab-mcq');
        const tabFill = document.getElementById('tab-fill');

        function switchTab(showMcq) {
            if (showMcq) {
                mcqSection.classList.remove('hidden');
                fillSection.classList.add('hidden');
                tabMcq.classList.replace('text-gray-600', 'text-indigo-600');
                tabMcq.classList.replace('hover:text-indigo-600', 'bg-white');
                tabMcq.classList.add('bg-white', 'shadow-sm');
                tabFill.classList.replace('bg-white', 'hover:text-indigo-600');
                tabFill.classList.replace('text-indigo-600', 'text-gray-600');
                tabFill.classList.remove('shadow-sm');
            } else {
                fillSection.classList.remove('hidden');
                mcqSection.classList.add('hidden');
                tabFill.classList.replace('text-gray-600', 'text-indigo-600');
                tabFill.classList.replace('hover:text-indigo-600', 'bg-white');
                tabFill.classList.add('bg-white', 'shadow-sm');
                tabMcq.classList.replace('bg-white', 'hover:text-indigo-600');
                tabMcq.classList.replace('text-indigo-600', 'text-gray-600');
                tabMcq.classList.remove('shadow-sm');
            }
        }

        tabMcq.addEventListener('click', () => switchTab(true));
        tabFill.addEventListener('click', () => switchTab(false));

        // 展開全部 / 收合全部
        const toggleAllBtn = document.getElementById('toggle-all');
        let isAllExpanded = false;

        toggleAllBtn.addEventListener('click', () => {
            isAllExpanded = !isAllExpanded;
            const activeSection = !mcqSection.classList.contains('hidden') ? mcqSection : fillSection;
            const buttons = activeSection.querySelectorAll('.toggle-btn');
            
            buttons.forEach(btn => {
                const ansBlock = btn.nextElementSibling;
                const icon = btn.querySelector('svg');
                const text = btn.querySelector('span');

                if (isAllExpanded) {
                    ansBlock.classList.add('show');
                    icon.classList.add('rotate-180');
                    text.textContent = '隱藏解答';
                } else {
                    ansBlock.classList.remove('show');
                    icon.classList.remove('rotate-180');
                    text.textContent = '查看解答與詳解';
                }
            });
            toggleAllBtn.textContent = isAllExpanded ? '收合全部詳解' : '展開全部詳解';
        });

        // 切換頁籤時重置「展開全部」按鈕狀態
        [tabMcq, tabFill].forEach(tab => {
            tab.addEventListener('click', () => {
                isAllExpanded = false;
                toggleAllBtn.textContent = '展開全部詳解';
            });
        });
    </script>
